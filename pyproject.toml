[project]
name = "kan-xhin-pum"
version = "0.1.0"
description = "Cost-aware simulation lab and guided tour through trading timeframes for first-time investors in Chile"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
app = ["streamlit>=1.37"]
bot = ["alpaca-py>=0.33"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kx = "kx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
